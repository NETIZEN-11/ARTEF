version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: redteam-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: redteam
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"  # set POSTGRES_HOST_PORT if a local PostgreSQL uses 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redteam-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  chromadb:
    image: chromadb/chroma:0.4.22
    container_name: redteam-chromadb
    ports:
      - "8001:8000"  # host 8001; the API owns host port 8000
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000

  # Optional object storage (not used by the evaluation pipeline). The minio/minio image is
  # no longer published on Docker Hub; start with `docker compose --profile storage up`
  # after pointing `image:` at a MinIO/S3-compatible image you have access to.
  minio:
    profiles: ["storage"]
    image: minio/minio:latest
    container_name: redteam-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    container_name: redteam-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/redteam
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=redteam-artifacts
      # Dev-only defaults; override in a root .env file (never commit real secrets).
      - SECRET_KEY=${SECRET_KEY:-dev-only-insecure-secret-key-change-me-0123456789}
      - JWT_PRIVATE_KEY_PATH=/app/backend/.keys/jwt_private.pem
      - JWT_PUBLIC_KEY_PATH=/app/backend/.keys/jwt_public.pem
      - DEBUG=false
      # local = deterministic judge for llm_rubric tests; live needs PRIMARY_JUDGE_API_KEY etc.
      - EVAL_MODE=${EVAL_MODE:-local}
      - PRIMARY_JUDGE_API_KEY=${PRIMARY_JUDGE_API_KEY:-}
      - SECONDARY_JUDGE_API_KEY=${SECONDARY_JUDGE_API_KEY:-}
      # The demo agents run inside this Docker network (private addresses).
      - TARGET_AGENT_BLOCK_PRIVATE_IPS=false
      # Demo agent URLs for scripts/seed_demo_data.py inside Docker (other SEED_* values
      # come from backend/.env, written by scripts/dev_setup.py).
      - SEED_MOCK_AGENT_V1_URL=http://demo-agent-safe:9001/chat
      - SEED_MOCK_AGENT_V2_URL=http://demo-agent-vulnerable:9002/chat
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - ./backend:/app/backend
      - ./evaluation:/app/evaluation:ro

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    container_name: redteam-worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 -Q default,evaluation,redteam,maintenance
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/redteam
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=redteam-artifacts
      # Dev-only defaults; override in a root .env file (never commit real secrets).
      - SECRET_KEY=${SECRET_KEY:-dev-only-insecure-secret-key-change-me-0123456789}
      - JWT_PRIVATE_KEY_PATH=/app/backend/.keys/jwt_private.pem
      - JWT_PUBLIC_KEY_PATH=/app/backend/.keys/jwt_public.pem
      - DEBUG=false
      # local = deterministic judge for llm_rubric tests; live needs PRIMARY_JUDGE_API_KEY etc.
      - EVAL_MODE=${EVAL_MODE:-local}
      - PRIMARY_JUDGE_API_KEY=${PRIMARY_JUDGE_API_KEY:-}
      - SECONDARY_JUDGE_API_KEY=${SECONDARY_JUDGE_API_KEY:-}
      # The demo agents run inside this Docker network (private addresses).
      - TARGET_AGENT_BLOCK_PRIVATE_IPS=false
      # Demo agent URLs for scripts/seed_demo_data.py inside Docker (other SEED_* values
      # come from backend/.env, written by scripts/dev_setup.py).
      - SEED_MOCK_AGENT_V1_URL=http://demo-agent-safe:9001/chat
      - SEED_MOCK_AGENT_V2_URL=http://demo-agent-vulnerable:9002/chat
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - ./backend:/app/backend
      - ./evaluation:/app/evaluation:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: redteam-frontend
    restart: unless-stopped
    environment:
      # Server-side proxy target for /api/v1 rewrites (next.config.mjs).
      - API_PROXY_TARGET=http://backend:8000/api/v1
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Demo target agents (the systems under test). Not part of the framework itself.
  demo-agent-safe:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    container_name: redteam-demo-agent-safe
    command: python /app/demo/target_agent.py --mode safe --host 0.0.0.0 --port 9001

  demo-agent-vulnerable:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    container_name: redteam-demo-agent-vulnerable
    command: python /app/demo/target_agent.py --mode vulnerable --host 0.0.0.0 --port 9002

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: redteam-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  grafana:
    image: grafana/grafana:10.2.0
    container_name: redteam-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  minio_data:
  prometheus_data:
  grafana_data: