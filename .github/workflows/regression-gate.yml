name: Regression Gate

# PRD primary metric: 100% of seeded regressions are detected and block the gate.
# Runs the end-to-end scenario in backend/tests/integration/test_pipeline.py:
#   safe agent -> approve baseline -> vulnerable agent (seeded jailbreak + PII regressions)
#   -> must be detected as Critical and BLOCK; safe agent again -> PASS;
#   unreachable agent -> gate FAIL (never a silent pass).
# The target agents are real HTTP services (demo/target_agent.py, rule-based backend);
# scoring uses deterministic matchers, so no LLM credentials are needed.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  regression-gate:
    name: Seeded regression benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies (pinned)
        run: |
          pip install -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Run seeded regression benchmark
        env:
          PYTHONIOENCODING: utf-8
        run: >
          pytest backend/tests/integration/test_pipeline.py backend/tests/integration/test_redteam.py
          -v -p no:cacheprovider --junitxml=regression-gate-results.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-gate-results
          path: regression-gate-results.xml
