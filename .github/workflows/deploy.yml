name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]
      version:
        description: "Version tag to deploy"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEPLOY_IMAGE_TAG: ${{ github.event.inputs.version || github.sha }}

jobs:
  validate-inputs:
    name: Validate deployment inputs
    runs-on: ubuntu-latest
    steps:
      - name: Confirm required deployment config exists
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ github.event.inputs.environment }}" || { echo "Missing environment input"; exit 1; }
          test -n "${{ github.event.inputs.version }}" || { echo "Missing version input"; exit 1; }
          echo "Deploying ${{ github.event.inputs.environment }} @ ${{ github.event.inputs.version }}"

  build-and-push:
    name: Build and Push Images
    needs: validate-inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=raw,value=${{ github.event.inputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=raw,value=${{ github.event.inputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Worker
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker
          tags: |
            type=raw,value=${{ github.event.inputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Worker
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test built backend image
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name artef-backend-smoke -p 8000:8000 \
            -e SECRET_KEY=test-secret-key-1234567890 \
            -e DATABASE_URL=sqlite:///tmp/artef-smoke.db \
            -e REDIS_URL=redis://host.docker.internal:6379/0 \
            -e CELERY_BROKER_URL=redis://host.docker.internal:6379/1 \
            -e CELERY_RESULT_BACKEND=redis://host.docker.internal:6379/2 \
            -e CHROMA_HOST=host.docker.internal \
            -e CHROMA_PORT=8000 \
            -e S3_ENDPOINT_URL=http://host.docker.internal:9000 \
            -e S3_ACCESS_KEY=test \
            -e S3_SECRET_KEY=test \
            -e S3_BUCKET=test-bucket \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.event.inputs.version }}
          sleep 20
          curl -fsS http://127.0.0.1:8000/api/v1/health
          docker stop artef-backend-smoke

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    if: github.event.inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to Staging
        shell: bash
        run: |
          set -euo pipefail
          echo "Deploying backend/frontend/worker image tags ${{ github.event.inputs.version }} to staging"
          echo "kubectl set image deployment/backend backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.event.inputs.version }}"
          echo "kubectl set image deployment/frontend frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.event.inputs.version }}"
          echo "kubectl set image deployment/worker worker=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker:${{ github.event.inputs.version }}"

      - name: Run staging smoke tests
        shell: bash
        run: |
          set -euo pipefail
          STAGING_BASE_URL="${{ vars.STAGING_BASE_URL }}"
          if [ -z "$STAGING_BASE_URL" ]; then
            echo "STAGING_BASE_URL is not configured; skipping smoke test."
            exit 0
          fi
          curl -fsS "$STAGING_BASE_URL/api/v1/health"

  deploy-production:
    name: Deploy to Production
    needs: build-and-push
    if: github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to Production (Canary)
        shell: bash
        run: |
          set -euo pipefail
          echo "Deploying to production with canary strategy..."
          echo "kubectl set image deployment/backend backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.event.inputs.version }}"
          echo "kubectl set image deployment/frontend frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.event.inputs.version }}"
          echo "kubectl set image deployment/worker worker=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker:${{ github.event.inputs.version }}"

      - name: Run production smoke tests
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTION_BASE_URL="${{ vars.PRODUCTION_BASE_URL }}"
          if [ -z "$PRODUCTION_BASE_URL" ]; then
            echo "PRODUCTION_BASE_URL is not configured; skipping smoke test."
            exit 0
          fi
          curl -fsS "$PRODUCTION_BASE_URL/api/v1/health"
          curl -fsS "$PRODUCTION_BASE_URL/"

      - name: Promote canary or rollback
        shell: bash
        run: |
          set -euo pipefail
          echo "Promoting canary to 100% or rolling back based on metrics"
          echo "Monitor error rate, latency, and business metrics before full promotion."

  notify:
    name: Notify Deployment Status
    needs: [deploy-staging, deploy-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send notification
        shell: bash
        run: |
          set -euo pipefail
          STATUS="${{ needs.deploy-staging.result }}${needs.deploy-production.result}"
          echo "Deployment completed with status: $STATUS"
          echo "Ready for Slack/email notification integration."
