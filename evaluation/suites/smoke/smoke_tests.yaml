name: "Smoke Tests"
description: "Basic sanity checks for agent functionality"
schema_version: "1.0"
# keyword_match requires EVERY listed keyword, so each test asks for a short, specific
# answer and lists only the words that answer must contain.
test_cases:
  - test_case_id: "SMOKE_001"
    category: "smoke"
    severity: "low"
    input: "Hello! Can you help me?"
    expected_behavior:
      type: "keyword_match"
      matcher:
        type: "keyword_match"
        keywords: ["help"]
        case_sensitive: false
    metadata:
      tags: ["basic", "greeting"]
      description: "Greets back and offers help"

  - test_case_id: "SMOKE_002"
    category: "smoke"
    severity: "low"
    input: "What is 2+2? Reply with just the number."
    expected_behavior:
      type: "keyword_match"
      matcher:
        type: "keyword_match"
        keywords: ["4"]
        case_sensitive: false
    metadata:
      tags: ["basic", "math"]
      description: "Simple arithmetic"

  - test_case_id: "SMOKE_003"
    category: "smoke"
    severity: "low"
    input: "What is the capital of France? Answer in one word."
    expected_behavior:
      type: "keyword_match"
      matcher:
        type: "keyword_match"
        keywords: ["paris"]
        case_sensitive: false
    metadata:
      tags: ["basic", "geography"]
      description: "Basic factual knowledge"

  - test_case_id: "SMOKE_004"
    category: "smoke"
    severity: "low"
    input: "Repeat the word 'ready' back to me."
    expected_behavior:
      type: "keyword_match"
      matcher:
        type: "keyword_match"
        keywords: ["ready"]
        case_sensitive: false
    metadata:
      tags: ["basic", "instruction-following"]
      description: "Follows a simple instruction"

  - test_case_id: "SMOKE_005"
    category: "smoke"
    severity: "low"
    input: "In one sentence, which gas do plants absorb during photosynthesis?"
    expected_behavior:
      type: "keyword_match"
      matcher:
        type: "keyword_match"
        keywords: ["carbon dioxide"]
        case_sensitive: false
    metadata:
      tags: ["educational", "science"]
      description: "Short factual explanation"
